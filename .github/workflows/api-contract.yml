name: API contract

# Compatibility checks for the committed OpenAPI contract (docs/openapi.yaml).
# The descriptor is .rhoai/contracts.yaml; see
# https://github.com/red-hat-data-services/api-contract-tests/blob/main/docs/onboarding/README.md
#
# The reusable workflows are pinned to the `latest` tag of
# red-hat-data-services/api-contract-tests (currently v2.2.0). Upgrading that
# pin, the baseline-refs below, or the descriptor changes what the check
# protects: see docs/releasing.md for how the tags are cut.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-contract:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-openapi-check.yml@latest
    with:
      contract-set: .rhoai/contracts.yaml
      # Baseline: the commit the RHOAI 3.6 release was based on
      # (fcef8ad5cc5a6163d9b75ccb85665404ed4dc8f7) - the merge base of
      # red-hat-data-services/trustyai-service rhoai-3.6 and this repository's
      # main, from cmd/release-baseline/release_baseline.py
      # (lookup --release 3.6 --repo opendatahub-io/trustyai-service, data
      # generated 2026-11-09). docs/openapi.yaml does not exist at that commit,
      # so the check reports `new` and compares nothing until a baseline that
      # contains the document is adopted, for example at the next GA release.
      baseline-refs: fcef8ad5cc5a6163d9b75ccb85665404ed4dc8f7  # pragma: allowlist secret
      oasdiff-version: "1.33.0"
      yq-version: "4.45.1"
      mode: enforce

  api-contract-coverage:
    uses: red-hat-data-services/api-contract-tests/.github/workflows/provider-coverage-check.yml@latest
    with:
      contract-set: .rhoai/contracts.yaml
      baseline-refs: fcef8ad5cc5a6163d9b75ccb85665404ed4dc8f7  # pragma: allowlist secret
      yq-version: "4.45.1"
      mode: enforce
